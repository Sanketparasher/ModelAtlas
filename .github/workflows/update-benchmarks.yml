name: Update benchmark snapshot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  refresh-benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh benchmark catalog
        run: npm run update:benchmarks

      - name: Validate updated benchmark data
        run: npm run validate:benchmarks

      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- src/data/generated-models.js; then
            echo "No benchmark changes detected."
            exit 0
          fi

          git add src/data/generated-models.js
          git commit -m "Refresh benchmark snapshot"
          git push
